<text class="l5" opacity="0" x="28" y="202" xml:space="preserve"><tspan fill="#f0a27a">  ● </tspan><tspan fill="#e8ecf2">Claude</tspan><tspan fill="#7d8799"> · turn 1 · 21s</tspan></text>
