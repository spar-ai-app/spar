<text class="l9" opacity="0" x="28" y="268" xml:space="preserve"><tspan fill="#5fd3a3">  ● </tspan><tspan fill="#e8ecf2">ChatGPT</tspan><tspan fill="#7d8799"> · turn 2 · 18s</tspan></text>
<text class="l10" opacity="0" x="28" y="290" xml:space="preserve"><tspan fill="#aab3c2">    - Misses overage fees: 10,000 km × $0.12 = $1,200/yr</tspan></text>
